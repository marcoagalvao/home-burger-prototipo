<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Reservas Home Burger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lobster&family=Zilla+Slab:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a2725; --bg2: #34302d; --line: #4a4440;
    --cream: #ede6cf; --cream-dim: #a9a191;
    --red: #d93a3a; --red-dark: #a92a2a;
    --floor: #312d2a; --floor2: #3a3431;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--cream); font: 17px/1.45 "Zilla Slab", Georgia, serif; }
  .demo { background: var(--red); color: var(--cream); text-align: center; font-size: 13px; padding: 6px 16px; }
  .app { max-width: 560px; margin: 0 auto; padding: 0 16px 180px; }
  header { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--line); }
  header img { width: 48px; height: 48px; object-fit: contain; }
  header .back { margin-left: auto; }
  .title { font-family: "Bebas Neue", sans-serif; font-size: 40px; line-height: .95; letter-spacing: .5px; margin: 24px 0 0; }
  .script { font-family: "Lobster", cursive; color: var(--red); font-size: 44px; line-height: 1; margin: 0 0 8px; transform: rotate(-3deg); display: inline-block; }
  .steps { display: flex; gap: 6px; margin: 16px 0 8px; }
  .steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
  .steps i.on { background: var(--red); }
  h2 { font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 24px; letter-spacing: 1px; margin: 28px 0 10px; }
  .muted { color: var(--cream-dim); font-size: 15px; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, .t:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .linkbtn { background: none; border: 0; color: var(--cream-dim); text-decoration: underline; padding: 4px; }

  /* pessoas */
  .stepper { display: flex; align-items: center; gap: 16px; }
  .stepper button { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--cream); background: none; font-size: 28px; line-height: 1; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper output { font-family: "Bebas Neue", sans-serif; font-size: 56px; min-width: 56px; text-align: center; line-height: 1; }
  .hint { margin-top: 10px; padding: 10px 12px; border-left: 3px solid var(--red); background: var(--bg2); font-size: 15px; }

  /* chips */
  /* calendário */
  .cal { background: var(--bg2); border: 2px solid var(--line); border-radius: 16px; padding: 14px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; text-align: center; }
  .cal-head b { font: 400 32px/1 "Bebas Neue", sans-serif; letter-spacing: 1px; }
  .cal-head small { font: 20px "Bebas Neue", sans-serif; color: var(--red); letter-spacing: 1px; }
  .cal-nav { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--cream); background: none; font-size: 24px; line-height: 1; }
  .cal-nav:disabled { opacity: .2; cursor: default; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-grid i { font: 15px "Bebas Neue", sans-serif; font-style: normal; text-align: center; color: var(--cream-dim); letter-spacing: 1px; padding-bottom: 4px; }
  .day { aspect-ratio: 1; border: 0; border-radius: 10px; background: var(--bg); font: 22px/1 "Bebas Neue", sans-serif; position: relative; transition: transform .15s; }
  .day:not(:disabled):hover { background: var(--line); }
  .day:disabled { background: none; opacity: .25; cursor: default; }
  .day.today::after { content: ""; position: absolute; left: 50%; bottom: 5px; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--red); }
  .day[aria-pressed="true"] { background: var(--red); color: var(--cream); transform: rotate(-4deg); box-shadow: 3px 3px 0 var(--cream); }
  .day[aria-pressed="true"]::after { background: var(--cream); }
  .cal-sel { margin-top: 14px; padding-top: 10px; border-top: 2px dashed var(--line); text-align: center; color: var(--cream-dim); }
  .cal-sel span { font: 28px "Lobster", cursive; color: var(--red); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .chip { flex: 0 0 auto; border: 2px solid var(--line); background: var(--bg2); border-radius: 10px; padding: 8px 12px; text-align: center; min-width: 64px; }
  .chip small { display: block; font-size: 12px; color: var(--cream-dim); text-transform: uppercase; letter-spacing: .5px; }
  .chip b { font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 24px; line-height: 1.1; }
  .chip[aria-pressed="true"] { border-color: var(--red); background: var(--red); }
  .chip[aria-pressed="true"] small { color: var(--cream); }
  .chip:disabled { opacity: .35; cursor: default; text-decoration: line-through; }

  /* barra de ação */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 24px 16px 16px; }
  .bar > div { max-width: 528px; margin: 0 auto; }
  .cta { width: 100%; border: 0; border-radius: 12px; background: var(--red); padding: 14px; font-family: "Bebas Neue", sans-serif; font-size: 24px; letter-spacing: 1px; }
  .cta:disabled { background: var(--line); color: var(--cream-dim); cursor: default; }
  .cta.ghost { background: none; border: 2px solid var(--cream); margin-top: 10px; }

  /* planta */
  .summary { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; background: var(--bg2); border-radius: 10px; padding: 10px 12px; margin-top: 16px; }
  .plan { width: 100%; height: auto; display: block; margin-top: 12px; }
  .plan .wall { stroke: var(--cream); stroke-width: 5; fill: none; stroke-linecap: round; }
  .plan .lbl { fill: var(--cream-dim); font: 13px "Bebas Neue", sans-serif; letter-spacing: 2px; }
  .t { cursor: pointer; transition: opacity .2s; }
  .t .top { fill: var(--cream); }
  .t .seat { fill: var(--cream-dim); }
  .t text { fill: var(--bg); font: 18px "Bebas Neue", sans-serif; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .t .ring { fill: none; stroke: transparent; stroke-width: 3; }
  .t.ideal .ring { stroke: var(--red); animation: pulse 1.6s ease-in-out infinite; }
  .t.ok .ring { stroke: var(--cream-dim); stroke-dasharray: 5 4; }
  .t.busy .top { fill: url(#hatch); }
  .t.busy .seat { fill: var(--line); }
  .t.busy text { fill: var(--cream-dim); }
  .t.unfit { opacity: .2; }
  .t.sel .top { fill: var(--red); }
  .t.sel text { fill: var(--cream); }
  .t.sel .ring { stroke: var(--cream); animation: none; }
  @keyframes pulse { 50% { stroke-opacity: .25; } }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 14px; color: var(--cream-dim); margin-top: 8px; }
  .legend span::before { content: ""; display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 6px; vertical-align: -2px; background: var(--cream); }
  .legend .l-ideal::before { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--red); }
  .legend .l-ok::before { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--cream-dim); }
  .legend .l-busy::before { background: repeating-linear-gradient(45deg, var(--line) 0 2px, #6b635c 2px 4px); }
  .legend .l-unfit::before { opacity: .2; }
  .legend .l-sel::before { background: var(--red); }

  /* painel da mesa */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet { background: var(--bg2); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; padding: 16px 16px 20px; animation: up .25s ease-out; }
  @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .photo { aspect-ratio: 16/10; border-radius: 12px; background: var(--floor) center/cover; display: grid; place-items: center; overflow: hidden; position: relative; }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo p { margin: 0; color: var(--cream-dim); font-size: 14px; text-align: center; }
  .sheet h3 { font-family: "Bebas Neue", sans-serif; font-weight: 400; font-size: 32px; margin: 14px 0 0; letter-spacing: 1px; }
  .tag { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px; background: var(--bg); margin: 4px 6px 0 0; }
  .tag.red { background: var(--red); }

  /* formulário */
  label { display: block; margin-top: 16px; font-size: 15px; color: var(--cream-dim); }
  input[type=text], input[type=tel] { display: block; width: 100%; margin-top: 6px; padding: 12px; border-radius: 10px; border: 2px solid var(--line); background: var(--bg2); color: var(--cream); font: inherit; }
  input[type=text]:focus, input[type=tel]:focus { border-color: var(--red); outline: none; }
  .check { display: flex; gap: 10px; align-items: center; color: var(--cream); }
  .check input { width: 22px; height: 22px; accent-color: var(--red); }
  .err { color: #ff8a80; font-size: 14px; margin-top: 4px; }

  /* comprovante */
  .ticket { margin-top: 24px; background: var(--cream); color: var(--bg); border-radius: 14px; padding: 20px; position: relative; }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 96px; width: 24px; height: 24px; border-radius: 50%; background: var(--bg); }
  .ticket::before { left: -12px; } .ticket::after { right: -12px; }
  .ticket .script { font-size: 36px; }
  .ticket dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 20px 0 0; padding-top: 16px; border-top: 2px dashed var(--cream-dim); }
  .ticket dt { color: #6b635c; font-size: 14px; }
  .ticket dd { margin: 0; font-weight: 700; }
  .code { font-family: "Bebas Neue", sans-serif; font-size: 22px; letter-spacing: 2px; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
<div class="demo" role="note">Protótipo não oficial · demonstração, nenhuma reserva é feita de verdade</div>
<div class="app">
  <header>
    <img src="Logo%20vintage%20Home%20Burger%20em%20textura%20desgastada.png" alt="Home Burger">
    <div><div class="title" style="margin:0;font-size:26px">Home Burger</div><div class="muted" style="font-size:13px">Burger · Fries · Friends</div></div>
    <button class="linkbtn back" id="back" hidden>← Voltar</button>
  </header>
  <div class="steps" aria-hidden="true"><i></i><i></i><i></i></div>
  <main id="view"><noscript><p class="hint">Este visualizador não roda o protótipo. Abra o arquivo no <b>Chrome</b>.</p></noscript></main>
</div>
<div class="bar"><div id="bar"></div></div>
<div id="sheet"></div>

<script>
const TYPES = {
  mesa:    { label: "Mesa do salão",    cap: "Até 4 pessoas (5 fica apertado)", fit: n => n <= 4 ? "ideal" : n === 5 ? "ok" : "no" },
  varanda: { label: "Mesa da varanda",  cap: "Até 4 pessoas",                   fit: n => n <= 4 ? "ok" : "no" }, // segunda opção: o salão é mais confortável
  sofa:    { label: "Sofá",             cap: "De 5 a 8 pessoas (4 de cada lado)", fit: n => n >= 5 ? "ideal" : "no" },
};
const TABLES = [
  { id: "m1", type: "mesa", n: 1, x: 120, y: 110 }, { id: "m2", type: "mesa", n: 2, x: 280, y: 110 },
  { id: "m3", type: "mesa", n: 3, x: 120, y: 215 }, { id: "m4", type: "mesa", n: 4, x: 280, y: 215 },
  { id: "v1", type: "varanda", n: 1, x: 90, y: 342 }, { id: "v2", type: "varanda", n: 2, x: 200, y: 342 },
  { id: "v3", type: "varanda", n: 3, x: 310, y: 342 },
  { id: "s1", type: "sofa", n: 1, x: 510, y: 100 }, { id: "s2", type: "sofa", n: 2, x: 510, y: 210 },
  { id: "s3", type: "sofa", n: 3, x: 510, y: 320 },
];
const name = t => `${t.type === "sofa" ? "Sofá" : t.type === "varanda" ? "Varanda" : "Mesa"} ${t.n}`;
const TIMES = Array.from({ length: 12 }, (_, i) => `${16 + Math.floor(i / 2)}:${i % 2 ? "30" : "00"}`);
const WD = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
const DAYS = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + i); return d; });
const iso = d => d.toLocaleDateString("sv");
const br = d => d.toLocaleDateString("pt-BR");

// ponytail: tudo livre no protótipo; ligar na disponibilidade real quando houver back-end
const busy = (id, date, time) => false;
const fit = t => TYPES[t.type].fit(S.people);
const state = t => S.table === t.id ? "sel" : fit(t) === "no" ? "unfit" : busy(t.id, S.date, S.time) ? "busy" : fit(t);
function past(date, time) {
  if (date !== iso(DAYS[0])) return false;
  const [h, m] = time.split(":").map(Number), now = new Date();
  return h * 60 + m < now.getHours() * 60 + now.getMinutes() + 30;
}
// TABLES já está na ordem de prioridade (salão > varanda > sofás); "ideal" vem antes de "ok"
const best = () => TABLES.filter(t => fit(t) !== "no" && !busy(t.id, S.date, S.time)).sort((a, b) => (fit(a) !== "ideal") - (fit(b) !== "ideal"))[0];
const okText = t => t.type === "varanda" ? "Segunda opção" : "Fica apertado";
const slotFree = time => !past(S.date, time) && TABLES.some(t => fit(t) !== "no" && !busy(t.id, S.date, time));

const S = { step: 1, people: 2, date: iso(DAYS[0]), time: null, table: null, escolher: null, cal: new Date(DAYS[0].getFullYear(), DAYS[0].getMonth(), 1), nome: "", tel: "", niver: false, code: "" };
const $ = s => document.querySelector(s);
const esc = s => s.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const dateObj = () => DAYS.find(d => iso(d) === S.date);
const table = () => TABLES.find(t => t.id === S.table);

function peopleHint() {
  if (S.people >= 5) return `Grupo de ${S.people}: liberamos os <b>sofás</b>, que acomodam até 8 pessoas.`;
  return "As mesas do salão são as mais confortáveis; a varanda é uma segunda opção. Os sofás ficam para grupos de 5+.";
}

function render() {
  document.querySelectorAll(".steps i").forEach((el, i) => el.classList.toggle("on", i < S.step));
  $("#back").hidden = S.step === 1 || S.step === 4;
  ({ 1: step1, 2: step2, 3: step3, 4: step4 })[S.step]();
}

function step1() {
  $("#view").innerHTML = `
    <h1 class="title">Reserve sua mesa na</h1>
    <span class="script">Home Burger</span>
    <h2>Quantas pessoas?</h2>
    <div class="stepper">
      <button id="minus" aria-label="Menos uma pessoa" ${S.people <= 1 ? "disabled" : ""}>−</button>
      <output aria-live="polite">${S.people}</output>
      <button id="plus" aria-label="Mais uma pessoa" ${S.people >= 8 ? "disabled" : ""}>+</button>
    </div>
    <div class="hint">${peopleHint()}${S.people >= 8 ? "<br>Mais de 8 pessoas? Fale com a gente no WhatsApp que a gente dá um jeito." : ""}</div>
    <h2>Qual dia?</h2>
    ${calendar()}
    <h2>Qual horário?</h2>
    <p class="muted" style="margin-top:-6px">Funcionamos das 16h às 23h.</p>
    <div class="grid">${TIMES.map(t => `
      <button class="chip" data-time="${t}" aria-pressed="${t === S.time}" ${slotFree(t) ? "" : "disabled"}>
        <b>${t}</b><small>${slotFree(t) ? "livre" : past(S.date, t) ? "passou" : "lotado"}</small>
      </button>`).join("")}</div>
    <h2>Quer escolher onde sentar?</h2>
    <div class="grid" style="grid-template-columns:1fr 1fr">
      <button class="chip" data-esc="1" aria-pressed="${S.escolher === true}"><b>Sim</b><small>Escolho no mapa</small></button>
      <button class="chip" data-esc="0" aria-pressed="${S.escolher === false}"><b>Não</b><small>Separem o melhor lugar</small></button>
    </div>`;
  $("#minus").onclick = () => setPeople(S.people - 1);
  $("#plus").onclick = () => setPeople(S.people + 1);
  document.querySelectorAll("[data-date]").forEach(b => b.onclick = () => { S.date = b.dataset.date; S.time = null; S.table = null; render(); });
  document.querySelectorAll("[data-nav]").forEach(b => b.onclick = () => { S.cal = new Date(S.cal.getFullYear(), S.cal.getMonth() + +b.dataset.nav, 1); render(); });
  document.querySelectorAll("[data-time]").forEach(b => b.onclick = () => { S.time = b.dataset.time; S.table = null; render(); });
  document.querySelectorAll("[data-esc]").forEach(b => b.onclick = () => { S.escolher = b.dataset.esc === "1"; S.table = null; render(); });
  const ready = S.time && S.escolher !== null;
  bar(`<button class="cta" ${ready ? "" : "disabled"} id="go">${!S.time ? "Escolha um horário" : S.escolher === null ? "Quer escolher onde sentar?" : S.escolher ? "Ver mapa das mesas →" : "Continuar →"}</button>`);
  $("#go").onclick = () => { if (S.escolher) return go(2); S.table = best().id; go(3); };
}
function calendar() {
  const m = S.cal, y = m.getFullYear(), mo = m.getMonth(), first = DAYS[0], last = DAYS[DAYS.length - 1];
  const fmt = (d, o) => d.toLocaleDateString("pt-BR", o);
  const days = Array.from({ length: new Date(y, mo + 1, 0).getDate() }, (_, i) => {
    const d = new Date(y, mo, i + 1), k = iso(d);
    return `<button class="day${k === iso(first) ? " today" : ""}" data-date="${k}" aria-pressed="${k === S.date}" ${d >= first && d <= last ? "" : "disabled"}
      aria-label="${fmt(d, { weekday: "long", day: "numeric", month: "long" })}">${i + 1}</button>`;
  });
  return `<div class="cal">
    <div class="cal-head">
      <button class="cal-nav" data-nav="-1" aria-label="Mês anterior" ${m > first ? "" : "disabled"}>‹</button>
      <div><b>${fmt(m, { month: "long" })}</b> <small>${y}</small></div>
      <button class="cal-nav" data-nav="1" aria-label="Próximo mês" ${new Date(y, mo + 1, 1) <= last ? "" : "disabled"}>›</button>
    </div>
    <div class="cal-grid">${["D", "S", "T", "Q", "Q", "S", "S"].map(w => `<i>${w}</i>`).join("")}${"<span></span>".repeat(m.getDay())}${days.join("")}</div>
    <div class="cal-sel">${S.date === iso(first) ? "Hoje, " : ""}<span>${fmt(dateObj(), { weekday: "long", day: "numeric", month: "long" })}</span></div>
  </div>`;
}
function setPeople(n) {
  S.people = n; S.table = null;
  if (S.time && !slotFree(S.time)) S.time = null;
  render();
}

function tableSvg(t) {
  const s = state(t), lbl = `${name(t)}, ${{ ideal: "livre, recomendada", ok: `livre, ${okText(t).toLowerCase()}`, busy: "ocupada", unfit: "não comporta o grupo", sel: "selecionada" }[s]}`;
  let g;
  if (t.type === "sofa") g = `
    <rect class="ring" x="${t.x - 62}" y="${t.y - 46}" width="124" height="92" rx="12"/>
    <rect class="seat" x="${t.x - 55}" y="${t.y - 40}" width="110" height="16" rx="6"/>
    <rect class="top" x="${t.x - 45}" y="${t.y - 17}" width="90" height="34" rx="4"/>
    <rect class="seat" x="${t.x - 55}" y="${t.y + 24}" width="110" height="16" rx="6"/>`;
  else if (t.type === "mesa") g = `
    <rect class="ring" x="${t.x - 50}" y="${t.y - 38}" width="100" height="76" rx="10"/>
    ${[-18, 18].flatMap(dx => [-29, 21].map(dy => `<rect class="seat" x="${t.x + dx - 8}" y="${t.y + dy}" width="16" height="8" rx="3"/>`)).join("")}
    <rect class="top" x="${t.x - 38}" y="${t.y - 18}" width="76" height="36" rx="4"/>`;
  else g = `
    <rect class="ring" x="${t.x - 38}" y="${t.y - 28}" width="76" height="56" rx="10"/>
    ${[-31, 23].map(dx => `<rect class="seat" x="${t.x + dx}" y="${t.y - 8}" width="8" height="16" rx="3"/>`).join("")}
    <rect class="seat" x="${t.x - 8}" y="${t.y - 25}" width="16" height="7" rx="3"/><rect class="seat" x="${t.x - 8}" y="${t.y + 18}" width="16" height="7" rx="3"/>
    <rect class="top" x="${t.x - 19}" y="${t.y - 16}" width="38" height="32" rx="4"/>`;
  return `<g class="t ${s}" data-id="${t.id}" role="button" tabindex="0" aria-label="${lbl}">${g}<text x="${t.x}" y="${t.y}">${t.type === "sofa" ? "S" : t.type === "varanda" ? "V" : ""}${t.n}</text></g>`;
}

function step2() {
  const d = dateObj();
  $("#view").innerHTML = `
    <h1 class="title">Escolha seu lugar</h1>
    <div class="summary">
      <span>${WD[d.getDay()]} ${br(d).slice(0, 5)} · <b>${S.time}</b> · <b>${S.people}</b> ${S.people > 1 ? "pessoas" : "pessoa"}</span>
      <button class="linkbtn" id="edit">alterar</button>
    </div>
    <svg class="plan" viewBox="0 0 600 430" role="group" aria-label="Planta da Home Burger">
      <defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <rect width="6" height="6" fill="#4a4440"/><line x1="0" y1="0" x2="0" y2="6" stroke="#6b635c" stroke-width="3"/></pattern></defs>
      <rect x="30" y="40" width="340" height="250" fill="var(--floor)"/>
      <rect x="30" y="290" width="340" height="100" fill="var(--floor2)"/>
      <rect x="370" y="40" width="200" height="350" fill="var(--floor)"/>
      <path class="wall" d="M370 40 H30 V390 H370 M370 40 V250 M370 40 H570 V390 H450"/>
      <path d="M30 290 H260" stroke="var(--cream-dim)" stroke-width="2" stroke-dasharray="6 6"/>
      <text class="lbl" x="42" y="62">SALÃO</text>
      <text class="lbl" x="42" y="308">VARANDA</text>
      <text class="lbl" x="388" y="62">SOFÁS</text>
      <text class="lbl" x="410" y="420" text-anchor="middle" fill="var(--red)" style="fill:var(--red)">▲ ENTRADA</text>
      ${TABLES.map(tableSvg).join("")}
    </svg>
    <div class="legend"><span class="l-ideal">Recomendada</span><span class="l-sel">Sua escolha</span><span class="l-ok">Outra opção</span><span class="l-unfit">Não comporta</span></div>
    <div class="hint">${peopleHint()} Toque numa mesa para ver a foto.</div>`;
  $("#edit").onclick = () => go(1);
  document.querySelectorAll(".t").forEach(g => {
    g.onclick = () => openSheet(g.dataset.id);
    g.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openSheet(g.dataset.id); } };
  });
  const t = table();
  bar(`<button class="cta" id="go" ${t ? "" : "disabled"}>${t ? `Continuar com ${name(t)} →` : "Toque numa mesa livre"}</button>`);
  $("#go").onclick = () => go(3);
}

function openSheet(id) {
  const t = TABLES.find(x => x.id === id), T = TYPES[t.type], s = state(t);
  const why = { unfit: S.people >= 5 ? `Não comporta ${S.people} pessoas.` : "Os sofás são para grupos de 5 a 8 pessoas.", busy: `Já reservada às ${S.time}. Tente outra mesa ou outro horário.` }[s];
  $("#sheet").innerHTML = `
    <div class="sheet-bg" id="bg"><div class="sheet" role="dialog" aria-modal="true" aria-label="${name(t)}">
      <div class="photo"><p>📷 Foto da ${name(t).toLowerCase()} em breve</p>
        <img src="fotos/${t.id}.jpg" alt="Foto da ${name(t)}" onerror="this.remove()"></div>
      <h3>${name(t)}</h3>
      <div><span class="tag">${T.label}</span><span class="tag">${T.cap}</span>
        ${s === "ideal" ? '<span class="tag red">Ideal para o seu grupo</span>' : s === "ok" ? `<span class="tag">${okText(t)}</span>`: ""}</div>
      ${why ? `<div class="hint">${why}</div>` : ""}
      <button class="cta" id="pick" style="margin-top:16px" ${why ? "disabled" : ""}>${why ? "Indisponível" : S.table === id ? "Mesa escolhida ✓" : "Escolher esta mesa"}</button>
      <button class="cta ghost" id="close">Fechar</button>
    </div></div>`;
  const close = () => { $("#sheet").innerHTML = ""; document.removeEventListener("keydown", onEsc); document.querySelector(`[data-id="${id}"]`)?.focus(); };
  const onEsc = e => e.key === "Escape" && close();
  document.addEventListener("keydown", onEsc);
  $("#bg").onclick = e => e.target.id === "bg" && close();
  $("#close").onclick = close;
  $("#pick").onclick = () => { S.table = id; $("#sheet").innerHTML = ""; document.removeEventListener("keydown", onEsc); render(); };
  (why ? $("#close") : $("#pick")).focus();
}

function step3() {
  const d = dateObj(), t = table();
  $("#view").innerHTML = `
    <h1 class="title">Quase lá!</h1>
    ${S.escolher ? "" : `<div class="hint">Separamos a <b>${name(t)}</b> pra vocês, o melhor lugar para ${S.people} ${S.people > 1 ? "pessoas" : "pessoa"}.</div>`}
    <div class="summary"><span>${name(t)} · ${WD[d.getDay()]} ${br(d).slice(0, 5)} · <b>${S.time}</b> · <b>${S.people}</b> ${S.people > 1 ? "pessoas" : "pessoa"}</span></div>
    <form id="f" novalidate>
      <label>Nome do responsável pela reserva<input type="text" id="nome" autocomplete="name" value="${esc(S.nome)}" required></label>
      <div class="err" id="e-nome"></div>
      <label>Telefone pra contato (WhatsApp)<input type="tel" id="tel" autocomplete="tel" inputmode="numeric" placeholder="(83) 99999-9999" value="${esc(S.tel)}" required></label>
      <div class="err" id="e-tel"></div>
      <label class="check"><input type="checkbox" id="niver" ${S.niver ? "checked" : ""}> É aniversário de alguém? 🎂</label>
      <div class="hint" id="promo" ${S.niver ? "" : "hidden"}>Traga <b>5 amigos pagantes</b> na semana do seu aniversário e ganhe uma <b>sobremesa</b> por nossa conta.</div>
    </form>`;
  $("#nome").oninput = e => S.nome = e.target.value;
  $("#tel").oninput = e => {
    const v = e.target.value.replace(/\D/g, "").slice(0, 11);
    e.target.value = S.tel = v.length > 6 ? `(${v.slice(0, 2)}) ${v.slice(2, v.length - 4)}-${v.slice(-4)}` : v.length > 2 ? `(${v.slice(0, 2)}) ${v.slice(2)}` : v;
  };
  $("#niver").onchange = e => { S.niver = e.target.checked; $("#promo").hidden = !S.niver; };
  bar(`<button class="cta" id="go">Confirmar reserva</button>`);
  $("#go").onclick = () => {
    const okNome = S.nome.trim().length >= 2, okTel = S.tel.replace(/\D/g, "").length >= 10;
    $("#e-nome").textContent = okNome ? "" : "Informe seu nome.";
    $("#e-tel").textContent = okTel ? "" : "Informe um telefone com DDD.";
    if (!okNome) return $("#nome").focus();
    if (!okTel) return $("#tel").focus();
    S.code = "HB-" + Math.random().toString(36).slice(2, 6).toUpperCase();
    go(4);
  };
}

function step4() {
  const d = dateObj(), t = table();
  const msg = `RESERVA NA HOME BURGER ❤️\n\n・Nome do responsável da reserva: ${S.nome.trim()}\n\n・Data: ${br(d)}\n\n・Horário: ${S.time}\n\n・Quantidade de pessoas: ${S.people}\n\n・Mesa: ${name(t)}${S.niver ? "\n\n・Aniversário 🎂" : ""}\n\nTelefone pra contato: ${S.tel}\n\nCódigo: ${S.code}`;
  $("#view").innerHTML = `
    <h1 class="title">Reserva simulada!</h1>
    <p class="muted">Isto é uma demonstração: <b>nenhuma reserva foi feita de verdade</b>. Para reservar, fale com a Home Burger.</p>
    <div class="ticket">
      <div class="title" style="margin:0;font-size:28px">Sua mesa na</div>
      <span class="script">Home Burger</span>
      <div class="code">${S.code}</div>
      <dl>
        <dt>Nome</dt><dd>${esc(S.nome.trim())}</dd>
        <dt>Data</dt><dd>${WD[d.getDay()]}, ${br(d)}</dd>
        <dt>Horário</dt><dd>${S.time}</dd>
        <dt>Pessoas</dt><dd>${S.people}</dd>
        <dt>Lugar</dt><dd>${name(t)}</dd>
        <dt>Contato</dt><dd>${esc(S.tel)}</dd>
      </dl>
      ${S.niver ? '<p style="margin:16px 0 0">🎂 Aniversário anotado! Com 5 amigos pagantes, a sobremesa é nossa.</p>' : ""}
    </div>`;
  // ponytail: wa.me sem número abre o seletor de contatos; colocar o número da casa (ex.: wa.me/5583XXXXXXXXX) quando tiver
  bar(`<a class="cta" style="display:block;text-align:center;text-decoration:none;color:inherit" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">Enviar no WhatsApp</a>
       <button class="cta ghost" id="new">Nova reserva</button>`);
  $("#new").onclick = () => { Object.assign(S, { time: null, table: null, code: "" }); go(1); };
}

function bar(html) { $("#bar").innerHTML = html; }
function go(step) { S.step = step; render(); scrollTo({ top: 0 }); $("#view").querySelector("h1")?.focus?.(); }
$("#back").onclick = () => go(S.step === 3 && !S.escolher ? 1 : S.step - 1);
render();
</script>
</body>
</html>
